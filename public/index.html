<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>VOID STRIKE</title>
<style>
:root{--bg:#060a14;--panel:rgba(12,20,36,.82);--line:rgba(90,200,255,.28);--cy:#38d6ff;--or:#ff8a34;--gr:#41ffb0;--tx:#e8f1ff;--dim:#8da2c2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:#03060c;color:var(--tx);font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow:hidden;touch-action:none}
canvas#game{position:fixed;inset:0;display:block;background:#03060c}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:linear-gradient(180deg,rgba(56,214,255,.16),rgba(56,214,255,.05));border:1px solid var(--line);color:var(--tx);padding:12px 22px;letter-spacing:.12em;font-weight:700;font-size:15px;text-transform:uppercase;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);transition:.15s}
.btn:hover{background:linear-gradient(180deg,rgba(56,214,255,.35),rgba(56,214,255,.12));border-color:var(--cy);transform:translateX(3px)}
.btn.pri{background:linear-gradient(180deg,#ff9d4d,#ff6a1a);color:#1a0b00;border:none}
.btn.pri:hover{filter:brightness(1.12)}
.btn.sm{padding:8px 14px;font-size:13px}
.btn:disabled{opacity:.4;pointer-events:none}
.screen{position:fixed;inset:0;display:none;z-index:20;overflow:auto;background:radial-gradient(1200px 700px at 70% 20%,rgba(40,90,170,.35),transparent 60%),linear-gradient(180deg,rgba(3,6,12,.55),rgba(3,6,12,.88))}
.screen.on{display:flex}
.wrap{margin:auto;width:min(1180px,96vw);display:flex;flex-direction:column;gap:14px;padding:10px}
h1.logo{margin:0;font-size:clamp(40px,7vw,86px);letter-spacing:.14em;font-weight:900;line-height:.95;background:linear-gradient(180deg,#fff,#7fe3ff 55%,#2a8bd6);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(56,214,255,.45))}
.tag{color:var(--or);letter-spacing:.35em;font-size:13px;text-transform:uppercase;margin-top:6px}
#menu .wrap{flex-direction:row;align-items:center;justify-content:space-between;gap:30px}
.nav{display:flex;flex-direction:column;gap:12px;margin-top:34px;align-items:flex-start}
.nav .btn{min-width:260px;text-align:left;font-size:17px}
.card{background:var(--panel);border:1px solid var(--line);padding:16px;backdrop-filter:blur(6px);clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.profile{min-width:280px;display:flex;flex-direction:column;gap:10px}
.profile input{background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--tx);padding:9px 10px;font-size:16px;width:100%;outline:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.kv{display:flex;justify-content:space-between;color:var(--dim);font-size:14px}.kv b{color:var(--tx)}
.coin{color:#ffd24a;font-weight:800}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top h2{margin:0;letter-spacing:.2em;font-size:22px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.mode{cursor:pointer;border:1px solid var(--line);background:var(--panel);padding:16px;transition:.15s;position:relative;min-height:128px}
.mode:hover{border-color:var(--cy);transform:translateY(-3px)}
.mode.sel{border-color:var(--or);box-shadow:0 0 0 1px var(--or),0 0 30px rgba(255,138,52,.25) inset}
.mode h3{margin:0 0 8px;letter-spacing:.12em;font-size:18px}.mode p{margin:0;color:var(--dim);font-size:14px;line-height:1.4}
.mode .ic{font-size:30px;position:absolute;right:14px;top:10px;opacity:.8}
.seg{display:flex;border:1px solid var(--line)}.seg button{background:none;border:none;padding:10px 18px;letter-spacing:.1em;font-weight:700;text-transform:uppercase;font-size:13px}.seg button.on{background:var(--cy);color:#00202c}
input[type=text].code{background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--tx);padding:10px;width:200px;text-transform:uppercase;letter-spacing:.2em;outline:none}
select,input[type=range]{accent-color:var(--cy)}
select{background:rgba(0,0,0,.5);color:var(--tx);border:1px solid var(--line);padding:8px}
.hint{color:var(--dim);font-size:13px}
/* armory */
.arm{display:grid;grid-template-columns:minmax(300px,1.2fr) 1fr;gap:14px;min-height:0}
.wtabs{display:flex;gap:6px;flex-wrap:wrap}.wtabs button{background:var(--panel);border:1px solid var(--line);padding:8px 12px;font-size:13px;letter-spacing:.06em;font-weight:700}
.wtabs button.on{background:var(--cy);color:#00202c}
#prevBox{position:relative;height:300px;background:radial-gradient(circle at 50% 40%,rgba(56,214,255,.18),transparent 65%),rgba(0,0,0,.35);border:1px solid var(--line)}
#prevBox canvas{width:100%;height:100%;display:block;cursor:grab}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:8px;font-size:13px;color:var(--dim)}
.bar{height:6px;background:rgba(255,255,255,.1);margin-top:3px}.bar i{display:block;height:100%;background:var(--cy)}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;overflow:auto;max-height:52vh;padding-right:4px}
.sk{border:1px solid var(--line);background:rgba(0,0,0,.3);padding:6px;cursor:pointer;position:relative;text-align:center;font-size:12px}
.sk img{width:100%;height:56px;object-fit:contain;display:block}
.sk .nm{margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sk.lock img{filter:grayscale(1) brightness(.45)}.sk.lock{opacity:.7}
.sk.sel{outline:2px solid var(--or)}
.sk .rb{position:absolute;left:0;right:0;bottom:0;height:3px}
.sk .cnt{position:absolute;right:5px;top:3px;font-size:11px;color:#ffd24a}
/* cases */
.casebox{display:flex;gap:24px;align-items:center;justify-content:center;flex-wrap:wrap;padding:20px}
.crate3d{width:190px;height:150px;position:relative;filter:drop-shadow(0 0 28px rgba(56,214,255,.5));animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-10px)}}
.crate3d div{position:absolute;inset:0;background:linear-gradient(135deg,#26405e,#142238);border:3px solid var(--cy);clip-path:polygon(0 18%,50% 0,100% 18%,100% 82%,50% 100%,0 82%)}
.crate3d b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:54px;color:var(--cy);text-shadow:0 0 20px var(--cy)}
.rar{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}.rar span{font-size:12px;padding:3px 8px;border:1px solid}
#caseOpen{position:fixed;inset:0;z-index:60;background:rgba(2,4,10,.94);display:none;flex-direction:column;align-items:center;justify-content:center;gap:30px}
#caseOpen.on{display:flex}
#roll{position:relative;width:min(1000px,96vw);height:170px;overflow:hidden;border-top:2px solid var(--line);border-bottom:2px solid var(--line);background:rgba(10,16,30,.8)}
#roll:after{content:"";position:absolute;left:50%;top:-6px;bottom:-6px;width:3px;background:var(--or);box-shadow:0 0 14px var(--or);z-index:2}
#strip{display:flex;height:100%;will-change:transform}
.rc{flex:0 0 160px;width:160px;min-width:0;overflow:hidden;height:100%;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1px solid rgba(255,255,255,.06);position:relative}
.rc img{width:140px;height:80px;object-fit:contain}.rc small{color:var(--dim);margin-top:4px;font-size:11px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.rc i{position:absolute;left:0;right:0;bottom:0;height:5px}
#reveal{text-align:center;opacity:0;transition:.4s;transform:scale(.9)}#reveal.on{opacity:1;transform:none}
#reveal img{width:min(440px,80vw);filter:drop-shadow(0 0 30px var(--rc))}#reveal h2{margin:6px 0;letter-spacing:.15em;color:var(--rc)}
/* overlays */
.overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(3,6,12,.78);backdrop-filter:blur(5px);flex-direction:column;gap:14px;text-align:center}
.overlay.on{display:flex}
.overlay h2{letter-spacing:.3em;font-size:34px;margin:0}
#toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:90;background:#ff8a34;color:#190a00;padding:10px 20px;font-weight:700;display:none;letter-spacing:.06em}
#end{z-index:55}
#end .card{width:min(860px,94vw);max-height:92vh;overflow:auto;text-align:left}
#end h2{font-size:46px;text-align:center}
.win{color:var(--gr)}.lose{color:#ff5a5a}
table{border-collapse:collapse;width:100%;font-size:14px}th{color:var(--dim);font-weight:600;text-align:left;font-size:12px;letter-spacing:.1em}td,th{padding:4px 8px}tr.me td{background:rgba(56,214,255,.14)}tr.dead td{opacity:.5}
/* HUD */
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;display:none;font-weight:700}
#hud.on{display:block}
#crosshair{position:absolute;left:50%;top:50%;width:0;height:0;--cc:#41ffb0;--gap:8px}
.ch{position:absolute;background:var(--cc);box-shadow:0 0 3px #000}
.ch.t{width:2px;height:9px;left:-1px;top:calc(-9px - var(--gap))}.ch.b{width:2px;height:9px;left:-1px;top:var(--gap)}
.ch.l{height:2px;width:9px;top:-1px;left:calc(-9px - var(--gap))}.ch.r{height:2px;width:9px;top:-1px;left:var(--gap)}
.chdot{position:absolute;width:2px;height:2px;left:-1px;top:-1px;background:var(--cc)}
#hitmarker{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px;opacity:0}
#hitmarker:before,#hitmarker:after{content:"";position:absolute;left:14px;top:2px;width:2px;height:26px;background:#fff;transform:rotate(45deg);box-shadow:0 0 4px #000}
#hitmarker:after{transform:rotate(-45deg)}#hitmarker.head:before,#hitmarker.head:after{background:#ff4d4d}
#hitmarker.on{animation:hm .25s ease-out}@keyframes hm{0%{opacity:1;transform:scale(1.4)}100%{opacity:0;transform:scale(.9)}}
#dmgflash{position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(255,0,0,.75))}
#dmgind{position:absolute;left:50%;top:50%;width:0;height:0}
.dmgarrow{position:absolute;left:-60px;top:-130px;width:120px;height:260px;animation:da .9s forwards;pointer-events:none}
.dmgarrow:before{content:"";position:absolute;left:30px;top:0;width:60px;height:34px;background:radial-gradient(ellipse at 50% 0,rgba(255,40,40,.95),transparent 70%)}
@keyframes da{to{opacity:0}}
#scope{position:absolute;inset:0;display:none;background:radial-gradient(circle at center,transparent 0,transparent 31vh,#000 31.4vh)}
#scope.on{display:block}
#scope:before{content:"";position:absolute;left:50%;top:50%;width:62vh;height:2px;background:#000;transform:translate(-50%,-50%)}
#scope:after{content:"";position:absolute;left:50%;top:50%;height:62vh;width:2px;background:#000;transform:translate(-50%,-50%)}
#topbar{position:absolute;left:50%;top:24px;transform:translateX(-50%);display:flex;align-items:center;gap:0;text-align:center}
#topbar .sc{font-size:30px;min-width:76px;padding:4px 10px;background:rgba(6,12,22,.65);border:1px solid var(--line)}
#timer{font-size:24px;padding:8px 18px;background:rgba(6,12,22,.8);border:1px solid var(--line);letter-spacing:.1em;min-width:100px}
#modeLabel{position:absolute;top:-2px;left:0;right:0;transform:translateY(-100%);font-size:11px;letter-spacing:.3em;color:var(--dim)}
#subTop{position:absolute;top:100%;left:0;right:0;margin-top:4px;font-size:13px;color:var(--dim);letter-spacing:.1em;white-space:nowrap}
#killfeed{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.kf{background:rgba(6,12,22,.7);padding:4px 10px;font-size:14px;border-left:3px solid #556;animation:kfin .2s}.kf.me{border-left-color:var(--or);background:rgba(60,30,10,.75)}.kf .kw{color:var(--dim);margin:0 4px;font-weight:500}
@keyframes kfin{from{opacity:0;transform:translateX(20px)}}
#hpbox{position:absolute;left:18px;bottom:18px;width:240px}
#hpVal{font-size:56px;line-height:1;text-shadow:0 0 12px rgba(0,0,0,.8)}#hpbox small{color:var(--dim);letter-spacing:.2em;font-size:11px}
#hpBar{height:6px;background:var(--gr);width:100%;transition:width .15s}#hpTrack{height:6px;background:rgba(255,255,255,.15);margin-top:4px}
#ammobox{position:absolute;right:18px;bottom:18px;text-align:right}
#ammoMag{font-size:56px;line-height:1;text-shadow:0 0 12px rgba(0,0,0,.8)}#ammoRes{font-size:24px;color:var(--dim)}
#wname{color:var(--or);letter-spacing:.14em;font-size:13px;text-transform:uppercase}#reloadTxt{color:#ffd24a;letter-spacing:.2em;font-size:13px;height:16px}
#wlist{position:absolute;right:18px;bottom:122px;display:flex;flex-direction:column;gap:3px;align-items:flex-end}
.ws{background:rgba(6,12,22,.55);padding:3px 10px;font-size:12px;color:var(--dim);letter-spacing:.06em}.ws.on{color:#fff;background:rgba(56,214,255,.3);border-right:3px solid var(--cy)}.ws i{font-style:normal;color:var(--or);margin-right:8px}
#msgbox{position:absolute;left:0;right:0;top:20%;text-align:center}
#msg{font-size:48px;letter-spacing:.2em;opacity:0;transition:opacity .3s;text-shadow:0 0 20px rgba(0,0,0,.9)}#msg.on{opacity:1}#msg.win{color:var(--gr)}#msg.lose{color:#ff5a5a}#msg.warn{color:#ff8a34}#msg.kill{font-size:30px;color:var(--or)}
#submsg{font-size:18px;color:var(--dim);letter-spacing:.2em;margin-top:6px}
#interact{position:absolute;left:0;right:0;top:62%;text-align:center;font-size:18px;color:#fff;text-shadow:0 0 8px #000;display:none}
#prog{position:absolute;left:50%;top:56%;width:280px;transform:translateX(-50%);display:none;text-align:center;font-size:14px;letter-spacing:.1em}
#progTrack{height:10px;background:rgba(0,0,0,.6);border:1px solid var(--line);margin-top:4px}#progBar{height:100%;width:0;background:var(--or)}
#radar{position:absolute;left:14px;top:14px;width:150px;height:150px;border-radius:50%}
#deathbox{position:absolute;left:0;right:0;bottom:22%;text-align:center;font-size:26px;display:none;text-shadow:0 0 10px #000}#deathbox.on{display:block}#deathbox small{font-size:18px;color:var(--dim)}
#nades{position:absolute;left:18px;bottom:146px;display:flex;gap:8px}.nd{background:rgba(6,12,22,.6);border:1px solid var(--line);padding:3px 9px;font-size:13px;color:var(--dim);letter-spacing:.05em}.nd.on{color:#fff;border-color:var(--cy)}.nd i{font-style:normal;color:var(--or);margin-right:6px}
#tut{position:absolute;left:50%;top:22%;transform:translateX(-50%);width:min(560px,92vw);background:rgba(6,12,22,.9);border:1px solid var(--cy);padding:14px 18px;display:none;pointer-events:auto;z-index:30}#tut.on{display:block}#tut h3{margin:0 0 8px;letter-spacing:.18em}#tut .tr{display:flex;gap:12px;margin:5px 0;font-size:14px}#tut .tr b{color:var(--or);min-width:96px}#tut small{display:block;margin-top:10px;color:var(--dim)}
.toprow{display:flex;gap:12px;padding:7px 4px;border-bottom:1px solid var(--line)}.toprow b{width:44px;color:var(--or)}.toprow span{flex:1}.toprow i{font-style:normal;color:var(--cy)}.toprow.me{background:rgba(56,214,255,.12)}
#flashov{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:40}
#money{position:absolute;left:18px;bottom:112px;font-size:24px;color:#ffd24a;text-shadow:0 0 8px #000}
#buy{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px,92vw);background:rgba(6,12,22,.92);border:1px solid var(--cy);padding:14px;display:none;pointer-events:auto}#buy.on{display:block}
#buy h3{margin:0 0 4px;letter-spacing:.2em}#buyMoney{color:#ffd24a;font-size:26px;margin-bottom:8px}
.bi{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);margin-top:5px;cursor:pointer}.bi i{font-style:normal;color:var(--or);width:16px}.bi span{flex:1}.bi b{color:#ffd24a}.bi.no{opacity:.4}.bi.have{border-color:var(--gr)}.bi:hover{background:rgba(56,214,255,.15)}#buy small{display:block;margin-top:8px;color:var(--dim);font-weight:400}
#pingbox{position:absolute;right:12px;bottom:4px;font-size:11px;color:var(--dim);font-weight:500}
#board{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(680px,94vw);background:rgba(6,12,22,.88);border:1px solid var(--line);padding:14px;display:none;max-height:80vh;overflow:auto}#board.on{display:block}#board h4{margin:8px 0 4px;letter-spacing:.14em}
#hint{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-size:11px;color:rgba(255,255,255,.35);font-weight:400}
/* touch */
#touch{position:fixed;inset:0;z-index:12;display:none;pointer-events:none}#touch.on{display:block}
#tz{position:absolute;inset:0;pointer-events:auto}
.tb{transform:scale(var(--ts,1));position:absolute;pointer-events:auto;width:64px;height:64px;border-radius:50%;background:rgba(56,214,255,.18);border:2px solid rgba(56,214,255,.5);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;letter-spacing:.05em}
#tFire{right:26px;bottom:90px;width:96px;height:96px;background:rgba(255,138,52,.3);border-color:var(--or)}#tJump{right:140px;bottom:50px}#tReload{right:140px;bottom:130px}#tScope{right:30px;bottom:200px}#tCrouch{right:218px;bottom:50px}#tSwap{right:218px;bottom:130px}#tAct{right:110px;bottom:210px;display:none}#tNade{right:218px;bottom:210px}#tPause{left:auto;right:14px;top:14px;width:44px;height:44px}
@media(max-width:820px){#menu .wrap{flex-direction:column;align-items:stretch}.arm{grid-template-columns:1fr}#hpVal,#ammoMag{font-size:38px}#hpbox{width:150px}#radar{width:110px;height:110px}.nav .btn{min-width:0;width:100%}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="dmgflash"></div><div id="dmgind"></div>
  <div id="scope"></div>
  <div id="crosshair"></div><div id="hitmarker"></div>
  <canvas id="radar" width="150" height="150"></canvas>
  <div id="topbar"><div id="modeLabel"></div><div class="sc" id="scoreL"></div><div id="timer">0:00</div><div class="sc" id="scoreR"></div><div id="subTop"></div></div>
  <div id="killfeed"></div>
  <div id="msgbox"><div id="msg"></div><div id="submsg"></div></div>
  <div id="interact"></div>
  <div id="prog"><div id="progLbl"></div><div id="progTrack"><div id="progBar"></div></div></div>
  <div id="deathbox"></div>
  <div id="hpbox"><small>HP</small><div id="hpVal">100</div><div id="hpTrack"><div id="hpBar"></div></div></div>
  <div id="wlist"></div>
  <div id="ammobox"><div id="reloadTxt"></div><div><span id="ammoMag">30</span> <span id="ammoRes"></span></div><div id="wname"></div></div>
  <div id="board"><div id="boardBody"></div></div>
  <div id="nades"></div><div id="money"></div>
  <div id="buy"><h3 id="buyT"></h3><div id="buyMoney"></div><div id="buyList"></div><small id="buyH"></small></div>
  <div id="pingbox"></div>
  <div id="flashov"></div>
  <div id="tut"><h3 id="tutT"></h3><div id="tutL"></div><small id="tutH"></small></div>
</div>
<div id="touch"><div id="tz"></div>
  <div class="tb" id="tFire">FIRE</div><div class="tb" id="tJump">JUMP</div><div class="tb" id="tReload">R</div><div class="tb" id="tCrouch">SIT</div><div class="tb" id="tScope">AIM</div><div class="tb" id="tSwap">⇄</div><div class="tb" id="tAct">E</div><div class="tb" id="tNade">GR</div><div class="tb" id="tPause">II</div>
</div>

<!-- Главное меню -->
<div class="screen on" id="menu"><div class="wrap">
  <div><h1 class="logo">VOID<br>STRIKE</h1><div class="tag" id="tagline"></div>
    <div class="nav"><button class="btn pri" id="bPlay"></button><button class="btn" id="bArmory"></button><button class="btn" id="bCases"></button><button class="btn" id="bTop"></button><button class="btn" id="bSettings"></button></div>
  </div>
  <div class="card profile" id="profile"></div>
</div></div>

<!-- Выбор режима -->
<div class="screen" id="playScr"><div class="wrap">
  <div class="top"><h2 id="playTitle"></h2><button class="btn sm" data-back>←</button></div>
  <div class="modes" id="modes"></div>
  <div class="card row" id="playOpts"></div>
  <div class="row"><button class="btn pri" id="bStart" style="font-size:20px;padding:14px 46px"></button><span class="hint" id="ctrlHint"></span></div>
</div></div>

<!-- Арсенал -->
<div class="screen" id="armoryScr"><div class="wrap">
  <div class="top"><h2 id="armTitle"></h2><div class="row"><span class="coin" id="armCoins"></span><button class="btn sm" data-back>←</button></div></div>
  <div class="wtabs" id="wtabs"></div>
  <div class="arm">
    <div class="card"><div id="prevBox"></div><div class="row" style="margin-top:8px;justify-content:space-between"><div><div id="armName" style="font-size:20px;letter-spacing:.1em;font-weight:800"></div><div id="armSkin" class="hint"></div></div><div class="row"><button class="btn sm" id="bLoad"></button><button class="btn sm pri" id="bEquip"></button></div></div><div class="stats" id="wstats"></div><div class="hint" style="margin-top:6px" id="rotHint"></div></div>
    <div class="card"><div class="skins" id="skins"></div></div>
  </div>
</div></div>

<!-- Кейсы -->
<div class="screen" id="casesScr"><div class="wrap">
  <div class="top"><h2 id="casesTitle"></h2><div class="row"><span class="coin" id="caseCoins"></span><button class="btn sm" data-back>←</button></div></div>
  <div class="card casebox"><div class="crate3d"><div></div><b>◆</b></div>
    <div><h3 id="caseName" style="margin:0 0 6px;letter-spacing:.15em;font-size:26px"></h3><div class="hint" id="caseDesc"></div><div class="rar" id="rarList"></div>
      <div class="row" style="margin-top:16px"><button class="btn pri" id="bOpen" style="font-size:18px"></button><button class="btn" id="bAd"></button></div></div></div>
  <div class="hint" id="invCount"></div>
</div></div>
<div id="caseOpen"><div id="roll"><div id="strip"></div></div><div id="reveal"></div><button class="btn" id="bRevealOk" style="display:none"></button></div>

<!-- Топ игроков -->
<div class="screen" id="topScr"><div class="wrap">
  <div class="top"><h2 id="topTitle"></h2><button class="btn sm" data-back>←</button></div>
  <div class="card" id="topBody" style="min-width:min(520px,92vw)"></div>
</div></div>

<!-- Настройки -->
<div class="screen" id="setScr"><div class="wrap">
  <div class="top"><h2 id="setTitle"></h2><button class="btn sm" data-back>←</button></div>
  <div class="card" id="setBody" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px"></div>
</div></div>

<!-- Пауза / лобби / конец -->
<div class="overlay" id="pause"><h2 id="pauseT"></h2><div class="hint" id="pauseH"></div><button class="btn pri" id="bResume"></button><button class="btn" id="bPauseSet"></button><button class="btn" id="bLeave"></button></div>
<div class="overlay" id="lobby"><h2 id="lobbyT" style="font-size:24px"></h2><div class="hint" id="lobbyH"></div><button class="btn" id="bLobbyCancel"></button></div>
<div class="overlay" id="end"><div class="card"><h2 id="endTitle"></h2><div id="endBody"></div><div class="row" style="justify-content:center;margin-top:14px"><button class="btn pri" id="bAgain"></button><button class="btn" id="bDouble"></button><button class="btn" id="bToMenu"></button></div></div></div>
<div class="overlay" id="loading"><h2>VOID STRIKE</h2><div class="hint" id="loadHint"></div></div>
<div id="toast"></div>

<script src="config.js"></script>
<script src="/sdk.js"></script>
<script src="game.js"></script>
</body>
</html>
